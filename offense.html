<!-- Offensive Metrics JS -->
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
<script>
    // Offensive Metrics Data
   const players = [
            {position:"Catcher", hittingPower:4, hittingContact:3, exitSpeed:51.56},
            {position:"Shortstop", hittingPower:3, hittingContact:2, exitSpeed:50.56},
            {position:"Pitcher", hittingPower:3, hittingContact:2, exitSpeed:49.56},
            {position:"Left Field", hittingPower:5, hittingContact:5, exitSpeed:56.3},
            {position:"Catcher", hittingPower:3, hittingContact:5, exitSpeed:49.51},
            {position:"Center Field", hittingPower:1, hittingContact:1, exitSpeed:35.34},
            {position:"Right Field", hittingPower:1, hittingContact:4, exitSpeed:38.34},
            {position:"Third Base", hittingPower:4, hittingContact:5, exitSpeed:52.34},
            {position:"Shortstop", hittingPower:5, hittingContact:2, exitSpeed:59},
            {position:"First Base", hittingPower:3, hittingContact:5, exitSpeed:54.97},
            {position:"Second Base", hittingPower:4, hittingContact:2, exitSpeed:56.98},
            {position:"Left Field", hittingPower:5, hittingContact:2, exitSpeed:67.6},
            {position:"Pitcher", hittingPower:3, hittingContact:5, exitSpeed:58.97},
            {position:"Third Base", hittingPower:4, hittingContact:2, exitSpeed:62.98},
            {position:"Catcher", hittingPower:1, hittingContact:3, exitSpeed:69.6},
            {position:"Center Field", hittingPower:4, hittingContact:5, exitSpeed:81.97},
            {position:"Right Field", hittingPower:2, hittingContact:3, exitSpeed:74.87},
            {position:"First Base", hittingPower:3, hittingContact:5, exitSpeed:84.6},
            {position:"Shortstop", hittingPower:2, hittingContact:5, exitSpeed:75.43},
            {position:"Second Base", hittingPower:5, hittingContact:5, exitSpeed:93.98},
        ];

    function average(array) {
        return array.reduce((sum, val) => sum + val, 0) / array.length;
    }

    const positions = [...new Set(players.map(p => p.position))];

    function getAvgByPosition(metric) {
        return positions.map(pos => {
            const vals = players.filter(p => p.position === pos).map(p => p[metric]);
            return average(vals);
        });
    }

     const hittingPowerData = getAvgByPosition("hittingPower");
        const hittingContactData = getAvgByPosition("hittingContact");
        const exitSpeedData = getAvgByPosition("exitSpeed");

    function createChart(canvasId, label, data) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: positions,
                datasets: [{
                    label: label,
                    data: data,
                    backgroundColor: 'rgba(255, 76, 42, 0.7)',
                    borderColor: 'rgba(255, 76, 42, 1)',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: true },
                    tooltip: { enabled: true },
                    datalabels: {  // <-- plugin configuration
                        anchor: 'end',
                        align: 'end',
                        color: '#000',
                        font: { weight: 'bold', size: 14 },
                        formatter: function(value) { return value.toFixed(2); }
                    }
                },
                scales: { y: { beginAtZero: true } }
            },
            plugins: [ChartDataLabels]  // <-- enable datalabels plugin
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
    // Create charts
            createChart('hittingPowerChart','Avg Hitting Power',hittingPowerData);
            createChart('hittingContactChart','Avg Hitting Contact',hittingContactData);
            createChart('exitSpeedChart','Avg Exit Speed',exitSpeedData);
        });
</script>
