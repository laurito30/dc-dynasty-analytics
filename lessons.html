    <title>DC Dynasty Baseball - Private Lessons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles.css">
    
</head>
<body>
<header>
    <div class="header">
        <img class="logo" src="images/dcdynasty.webp" alt="DC Dynasty Logo" width="75" height="75"/>
        <h1 class="title">Private Lessons</h1>
        <nav class="navbar">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="lessons.html">Private Lessons</a>
                <div class="dropdown">
                    <button class="dropbtn">Metrics ▼</button>
                    <div class="dropdown-content">
                        <a href="#">Hitting Metrics</a>
                        <a href="#">Throwing Metrics</a>
                        <a href="#">Running Metrics</a>
                        <a href="#">Fielding Metrics</a>
                    </div>
                </div> 
            </nav>
    </div>
</header>

<main>
    <section class="lessons-section">
        <h2>Book a Private Lesson</h2>
        <form class="lessons-form" id="lessonsForm">
            <label for="date">Select Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Select Time:</label>
            <input type="time" id="time" name="time" min="08:00" max="20:00" required>

            <label for="instructor">Choose Instructor:</label>
            <select id="instructor" name="instructor" required>
                <option value="">-- Select Instructor --</option>
                <option value="Brian Laurito">Brian Laurito</option>
                <option value="Rodger Mendoza">Rodger Mendoza</option>
                <option value="Shano Sweet">Shano Sweet</option>
                <option value="Antoine Williams">Antoine Williams</option>
            </select>

            <label for="lessonType">Select Lesson Type:</label>
            <select id="lessonType" name="lessonType" required>
                <option value="">-- Select Lesson Type --</option>
                <option value="Hitting">Hitting</option>
                <option value="Pitching">Pitching</option>
                <option value="Fielding">Fielding</option>
                <option value="Catching">Catching</option>
                <option value="Strength Training">Strength Training</option>
            </select>

            <label for="email">Your Email:</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>

            <button type="submit">Book Lesson</button>
        </form>
    </section>
</main>

<!-- Footer -->
    <footer>
      <!-- left side-->
      <img class="logo" src="images/dcdynastyproperty.jpg" alt="logo" width="75" height="75">
      <!-- center side -->      
      <p>Head Administrator: Brian Laurito<br>
            <a href="mailto:laurito@cua.edu">blaurito@dcdynasty.com</a></p>
      <!-- center side -->  
  <div class="footer-buttons-container">
    <button type="button" class="footer-button" onclick="window.location.href='contactus.html'">Contact Us</button>
    <button type="button" class="footer-button" onclick="window.location.href='privacy.html'">Privacy Policy</button>
    <button type="button" class="footer-button" onclick="window.location.href='terms.html'">Terms of Service</button>
    <button type="button" class="footer-button" onclick="window.location.href='careers.html'">Careers</button>
  </div>

    </footer> 
<script>
    // Form submission using mailto for simplicity
    document.getElementById("lessonsForm").addEventListener("submit", function(e){
        e.preventDefault();
        
        const date = document.getElementById("date").value;
        const time = document.getElementById("time").value;
        const instructor = document.getElementById("instructor").value;
        const lessonType = document.getElementById("lessonType").value;
        const email = document.getElementById("email").value;

        const subject = `Private Lesson Booking - DC Dynasty`;
        const body = `Hello,\n\nI would like to book a private lesson with the following details:\n\nDate: ${date}\nTime: ${time}\nInstructor: ${instructor}\nLesson Type: ${lessonType}\n\nPlease confirm this booking at my email: ${email}\n\nThank you!`;

        window.location.href = `mailto:laurito@cua.edu?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });
</script>

</body>
</html>
